# =============================================================================
# Dify — ready-to-deploy on Coolify
# =============================================================================
# Pinned to Dify v1.19.0. This is a curated, opinionated subset of Dify's
# official docker/docker-compose.yaml, adapted for Coolify:
#
#   * Public entrypoint is the `nginx` service. It declares
#     SERVICE_FQDN_NGINX_80 so Coolify assigns a domain, terminates TLS at its
#     own proxy, and routes traffic to nginx on port 80. No host ports are
#     published and Dify's built-in certbot is dropped.
#   * All secrets are generated by Coolify via SERVICE_PASSWORD_* /
#     SERVICE_PASSWORD_64_* magic variables — nothing to set by hand.
#   * Persistent data lives in named volumes managed by Coolify. Config files
#     are embedded as inline `configs:` at the end of this file, because
#     Coolify does not copy repo files for bind mounts. Edit the source files
#     and run scripts/embed-configs.py.
#   * Default vector store is Weaviate.
#
# See README.md for step-by-step deployment instructions.
# To run locally without Coolify: `cp .env.example .env`, fill in the secrets,
# then `docker compose up -d`.
# =============================================================================

x-shared-env: &shared-env
  # --- Public URLs -----------------------------------------------------------
  # Left empty on purpose: with a single domain Dify derives absolute URLs from
  # the incoming request (Host + X-Forwarded-Proto that Coolify/nginx forward).
  # Override in Coolify only if share links / file URLs show the wrong scheme.
  CONSOLE_API_URL: ${CONSOLE_API_URL:-}
  CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-}
  SERVICE_API_URL: ${SERVICE_API_URL:-}
  APP_API_URL: ${APP_API_URL:-}
  APP_WEB_URL: ${APP_WEB_URL:-}
  FILES_URL: ${FILES_URL:-}
  INTERNAL_FILES_URL: ${INTERNAL_FILES_URL:-http://api:5001}
  ENDPOINT_URL_TEMPLATE: ${ENDPOINT_URL_TEMPLATE:-http://localhost/e/{hook_id}}
  # --- General / security ----------------------------------------------------
  # SECRET_KEY is generated by Coolify. If left empty (e.g. local run without a
  # value) Dify auto-generates and persists one in the storage volume.
  SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
  INIT_PASSWORD: ${INIT_PASSWORD:-}
  DEPLOY_ENV: ${DEPLOY_ENV:-PRODUCTION}
  CHECK_UPDATE_URL: ${CHECK_UPDATE_URL:-https://updates.dify.ai}
  OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
  MIGRATION_ENABLED: ${MIGRATION_ENABLED:-true}
  FILES_ACCESS_TIMEOUT: ${FILES_ACCESS_TIMEOUT:-300}
  LANG: ${LANG:-C.UTF-8}
  LC_ALL: ${LC_ALL:-C.UTF-8}
  PYTHONIOENCODING: ${PYTHONIOENCODING:-utf-8}
  # --- Logging / server workers ----------------------------------------------
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FILE: ${LOG_FILE:-/app/logs/server.log}
  LOG_FILE_MAX_SIZE: ${LOG_FILE_MAX_SIZE:-20}
  LOG_FILE_BACKUP_COUNT: ${LOG_FILE_BACKUP_COUNT:-5}
  DEBUG: ${DEBUG:-false}
  FLASK_DEBUG: ${FLASK_DEBUG:-false}
  DIFY_BIND_ADDRESS: ${DIFY_BIND_ADDRESS:-0.0.0.0}
  DIFY_PORT: ${DIFY_PORT:-5001}
  SERVER_WORKER_AMOUNT: ${SERVER_WORKER_AMOUNT:-1}
  SERVER_WORKER_CLASS: ${SERVER_WORKER_CLASS:-gevent}
  SERVER_WORKER_CONNECTIONS: ${SERVER_WORKER_CONNECTIONS:-10}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-360}
  CELERY_WORKER_AMOUNT: ${CELERY_WORKER_AMOUNT:-1}
  CELERY_AUTO_SCALE: ${CELERY_AUTO_SCALE:-false}
  # --- Database (PostgreSQL) --------------------------------------------------
  DB_TYPE: ${DB_TYPE:-postgresql}
  DB_HOST: ${DB_HOST:-db_postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
  DB_DATABASE: ${DB_DATABASE:-dify}
  DB_PLUGIN_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
  SQLALCHEMY_POOL_SIZE: ${SQLALCHEMY_POOL_SIZE:-30}
  SQLALCHEMY_POOL_RECYCLE: ${SQLALCHEMY_POOL_RECYCLE:-3600}
  SQLALCHEMY_ECHO: ${SQLALCHEMY_ECHO:-false}
  # --- Redis / Celery ---------------------------------------------------------
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_USERNAME: ${REDIS_USERNAME:-}
  REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
  REDIS_USE_SSL: ${REDIS_USE_SSL:-false}
  REDIS_DB: ${REDIS_DB:-0}
  CELERY_BROKER_URL: redis://:${SERVICE_PASSWORD_REDIS}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/1
  CELERY_BACKEND: ${CELERY_BACKEND:-redis}
  BROKER_USE_SSL: ${BROKER_USE_SSL:-false}
  # --- CORS -------------------------------------------------------------------
  WEB_API_CORS_ALLOW_ORIGINS: ${WEB_API_CORS_ALLOW_ORIGINS:-*}
  CONSOLE_CORS_ALLOW_ORIGINS: ${CONSOLE_CORS_ALLOW_ORIGINS:-*}
  # --- File storage (local filesystem via OpenDAL) ---------------------------
  STORAGE_TYPE: ${STORAGE_TYPE:-opendal}
  OPENDAL_SCHEME: ${OPENDAL_SCHEME:-fs}
  OPENDAL_FS_ROOT: ${OPENDAL_FS_ROOT:-storage}
  # --- Vector store (Weaviate) -----------------------------------------------
  VECTOR_STORE: ${VECTOR_STORE:-weaviate}
  VECTOR_INDEX_NAME_PREFIX: ${VECTOR_INDEX_NAME_PREFIX:-Vector_index}
  WEAVIATE_ENDPOINT: ${WEAVIATE_ENDPOINT:-http://weaviate:8080}
  WEAVIATE_GRPC_ENDPOINT: ${WEAVIATE_GRPC_ENDPOINT:-grpc://weaviate:50051}
  WEAVIATE_API_KEY: ${SERVICE_PASSWORD_WEAVIATE}
  # --- Code execution sandbox ------------------------------------------------
  CODE_EXECUTION_ENDPOINT: ${CODE_EXECUTION_ENDPOINT:-http://sandbox:8194}
  CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
  CODE_MAX_NUMBER: ${CODE_MAX_NUMBER:-9223372036854775807}
  CODE_MIN_NUMBER: ${CODE_MIN_NUMBER:--9223372036854775808}
  CODE_MAX_STRING_LENGTH: ${CODE_MAX_STRING_LENGTH:-80000}
  # --- SSRF proxy (outbound HTTP goes through squid) -------------------------
  SSRF_PROXY_HTTP_URL: ${SSRF_PROXY_HTTP_URL:-http://ssrf_proxy:3128}
  SSRF_PROXY_HTTPS_URL: ${SSRF_PROXY_HTTPS_URL:-http://ssrf_proxy:3128}
  # --- Plugin daemon / marketplace -------------------------------------------
  PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
  PLUGIN_DAEMON_KEY: ${SERVICE_PASSWORD_64_PLUGINDAEMON}
  INNER_API_KEY_FOR_PLUGIN: ${SERVICE_PASSWORD_64_INNERAPI}
  PLUGIN_MAX_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
  PLUGIN_REMOTE_INSTALL_HOST: ${PLUGIN_REMOTE_INSTALL_HOST:-plugin_daemon}
  PLUGIN_REMOTE_INSTALL_PORT: ${PLUGIN_REMOTE_INSTALL_PORT:-5003}
  MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-true}
  MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
  # --- Agent backend (Agent v2, new in 1.19) ---------------------------------
  AGENT_BACKEND_BASE_URL: ${AGENT_BACKEND_BASE_URL:-http://agent_backend:5050}
  AGENT_BACKEND_API_TOKEN: ${SERVICE_PASSWORD_64_AGENTAPI}
  DIFY_AGENT_API_TOKEN: ${SERVICE_PASSWORD_64_AGENTAPI}
  NEXT_PUBLIC_ENABLE_AGENT_V2: ${NEXT_PUBLIC_ENABLE_AGENT_V2:-true}
  # --- Proxy headers ---------------------------------------------------------
  # nginx is the only way in, so the API trusts its X-Forwarded-* headers.
  RESPECT_XFORWARD_HEADERS_ENABLED: ${RESPECT_XFORWARD_HEADERS_ENABLED:-true}
  REDIS_KEEPALIVE: ${REDIS_KEEPALIVE:-true}

services:
  # ---------------------------------------------------------------------------
  # Init container: fix ownership of the shared storage volume for the app user.
  # ---------------------------------------------------------------------------
  init_permissions:
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - dify_app_storage:/app/api/storage
    restart: "no"

  # ---------------------------------------------------------------------------
  # Dify API (console + service API).
  # ---------------------------------------------------------------------------
  api:
    image: langgenius/dify-api:1.19.0
    restart: always
    environment:
      <<: *shared-env
      MODE: api
      SENTRY_DSN: ${API_SENTRY_DSN:-}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
      - dify_app_storage:/app/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ssrf_proxy_network
      - default

  # ---------------------------------------------------------------------------
  # WebSocket service for real-time workflow collaboration (socket.io).
  # ---------------------------------------------------------------------------
  api_websocket:
    image: langgenius/dify-api:1.19.0
    restart: always
    environment:
      <<: *shared-env
      MODE: api
      SERVER_WORKER_AMOUNT: 1
      SERVER_WORKER_CLASS: ${API_WEBSOCKET_WORKER_CLASS:-geventwebsocket.gunicorn.workers.GeventWebSocketWorker}
      SERVER_WORKER_CONNECTIONS: ${API_WEBSOCKET_WORKER_CONNECTIONS:-1000}
      GUNICORN_TIMEOUT: ${API_WEBSOCKET_GUNICORN_TIMEOUT:-360}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - ssrf_proxy_network
      - default

  # ---------------------------------------------------------------------------
  # Celery worker: dataset indexing, workflows, mail, and other async tasks.
  # ---------------------------------------------------------------------------
  worker:
    image: langgenius/dify-api:1.19.0
    restart: always
    environment:
      <<: *shared-env
      MODE: worker
      SENTRY_DSN: ${API_SENTRY_DSN:-}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - dify_app_storage:/app/api/storage
    networks:
      - ssrf_proxy_network
      - default

  # ---------------------------------------------------------------------------
  # Celery beat: schedules periodic tasks.
  # ---------------------------------------------------------------------------
  worker_beat:
    image: langgenius/dify-api:1.19.0
    restart: always
    environment:
      <<: *shared-env
      MODE: beat
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ssrf_proxy_network
      - default

  # ---------------------------------------------------------------------------
  # Dify web frontend (Next.js).
  # ---------------------------------------------------------------------------
  web:
    image: langgenius/dify-web:1.19.0
    restart: always
    environment:
      # Docker's hostname can resolve to only one interface on Coolify's networks.
      HOSTNAME: "0.0.0.0"
      CONSOLE_API_URL: ${CONSOLE_API_URL:-}
      APP_API_URL: ${APP_API_URL:-}
      SERVER_CONSOLE_API_URL: ${SERVER_CONSOLE_API_URL:-http://api:5001}
      NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-}
      # Real-time collaboration socket. Coolify terminates TLS, so this is wss://<domain>.
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-wss://${SERVICE_FQDN_NGINX}}
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      TEXT_GENERATION_TIMEOUT_MS: ${TEXT_GENERATION_TIMEOUT_MS:-60000}
      CSP_WHITELIST: ${CSP_WHITELIST:-}
      ALLOW_EMBED: ${ALLOW_EMBED:-false}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-https://marketplace.dify.ai}
      TOP_K_MAX_VALUE: ${TOP_K_MAX_VALUE:-10}
      INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH: ${INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH:-4000}
      LOOP_NODE_MAX_COUNT: ${LOOP_NODE_MAX_COUNT:-100}
      MAX_TOOLS_NUM: ${MAX_TOOLS_NUM:-10}
      MAX_PARALLEL_LIMIT: ${MAX_PARALLEL_LIMIT:-10}
      MAX_ITERATIONS_NUM: ${MAX_ITERATIONS_NUM:-99}
      ENABLE_WEBSITE_JINAREADER: ${ENABLE_WEBSITE_JINAREADER:-true}
      ENABLE_WEBSITE_FIRECRAWL: ${ENABLE_WEBSITE_FIRECRAWL:-true}
      ENABLE_WEBSITE_WATERCRAWL: ${ENABLE_WEBSITE_WATERCRAWL:-true}
      NEXT_PUBLIC_ENABLE_AGENT_V2: ${NEXT_PUBLIC_ENABLE_AGENT_V2:-true}
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # PostgreSQL 15. Also creates the `dify_plugin` database on first init
  # (see postgres/initdb) as a safety net for the plugin daemon.
  # ---------------------------------------------------------------------------
  db_postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      DB_PLUGIN_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-200}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
    volumes:
      - dify_db_data:/var/lib/postgresql/data
    configs:
      - source: postgres_initdb_plugin
        target: /docker-entrypoint-initdb.d/01-create-plugin-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${DB_USERNAME:-postgres}", "-d", "${DB_DATABASE:-dify}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------------------
  # Redis 6 (Celery broker + cache).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:6-alpine
    restart: always
    environment:
      REDISCLI_AUTH: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - dify_redis_data:/data
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${SERVICE_PASSWORD_REDIS} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------------------
  # DifySandbox: isolated runtime for the Code node. Internal network only.
  # ---------------------------------------------------------------------------
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    environment:
      API_KEY: ${SANDBOX_API_KEY:-dify-sandbox}
      GIN_MODE: ${SANDBOX_GIN_MODE:-release}
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-http://ssrf_proxy:3128}
      HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-http://ssrf_proxy:3128}
      SANDBOX_PORT: ${SANDBOX_PORT:-8194}
    volumes:
      - dify_sandbox_dependencies:/dependencies
    configs:
      - source: sandbox_config
        target: /conf/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8194/health"]
    networks:
      - ssrf_proxy_network

  # ---------------------------------------------------------------------------
  # Plugin daemon: installs and runs Dify plugins. Uses the `dify_plugin` DB.
  # ---------------------------------------------------------------------------
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.14-local
    restart: always
    environment:
      DB_TYPE: ${DB_TYPE:-postgresql}
      DB_HOST: ${DB_HOST:-db_postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      SERVER_KEY: ${SERVICE_PASSWORD_64_PLUGINDAEMON}
      MAX_PLUGIN_PACKAGE_SIZE: ${PLUGIN_MAX_PACKAGE_SIZE:-52428800}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_INNER_API_KEY: ${SERVICE_PASSWORD_64_INNERAPI}
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      FORCE_VERIFYING_SIGNATURE: ${FORCE_VERIFYING_SIGNATURE:-true}
      PYTHON_ENV_INIT_TIMEOUT: ${PLUGIN_PYTHON_ENV_INIT_TIMEOUT:-120}
      PLUGIN_MAX_EXECUTION_TIMEOUT: ${PLUGIN_MAX_EXECUTION_TIMEOUT:-600}
      PLUGIN_STORAGE_TYPE: ${PLUGIN_STORAGE_TYPE:-local}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
      PLUGIN_INSTALLED_PATH: ${PLUGIN_INSTALLED_PATH:-plugin}
      PLUGIN_PACKAGE_CACHE_PATH: ${PLUGIN_PACKAGE_CACHE_PATH:-plugin_packages}
      PLUGIN_MEDIA_CACHE_PATH: ${PLUGIN_MEDIA_CACHE_PATH:-assets}
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-true}
      MARKETPLACE_API_URL: ${MARKETPLACE_API_URL:-https://marketplace.dify.ai}
    volumes:
      - dify_plugin_daemon:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ssrf_proxy_network
      - default

  # ---------------------------------------------------------------------------
  # SSRF proxy (squid): mediates outbound requests from api/worker/sandbox so
  # user-supplied URLs cannot reach internal services.
  # ---------------------------------------------------------------------------
  ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    configs:
      - source: squid_conf
        target: /etc/squid/squid.conf.template
      - source: squid_common_conf
        target: /etc/squid/dify_common.conf.template
      - source: ssrf_entrypoint
        target: /docker-entrypoint-mount.sh
    entrypoint: ["sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"]
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    networks:
      - ssrf_proxy_network
      - default

  # ---------------------------------------------------------------------------
  # Agent backend (Agent v2). Runs agent shells in local_sandbox.
  # ---------------------------------------------------------------------------
  agent_backend:
    image: langgenius/dify-agent-backend:1.19.0
    restart: always
    # The stub token key must be unpadded base64url of exactly 32 bytes, which
    # no Coolify magic variable produces, so derive it from a generated secret.
    command:
      - sh
      - -c
      - |
        if [ -z "$${DIFY_AGENT_SERVER_SECRET_KEY:-}" ]; then
          DIFY_AGENT_SERVER_SECRET_KEY=$$(python -c 'import base64,hashlib,os; print(base64.urlsafe_b64encode(hashlib.sha256(os.environ["AGENT_SECRET_SEED"].encode()).digest()).rstrip(b"=").decode())')
          export DIFY_AGENT_SERVER_SECRET_KEY
        fi
        exec uvicorn dify_agent.server.app:app --host 0.0.0.0 --port 5050
    environment:
      AGENT_SECRET_SEED: ${SERVICE_PASSWORD_64_AGENTSECRET}
      DIFY_AGENT_API_TOKEN: ${SERVICE_PASSWORD_64_AGENTAPI}
      DIFY_AGENT_REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/2
      DIFY_AGENT_PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${SERVICE_PASSWORD_64_PLUGINDAEMON}
      DIFY_AGENT_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_AGENT_INNER_API_KEY: ${SERVICE_PASSWORD_64_INNERAPI}
      DIFY_AGENT_RUNTIME_BACKEND: ${DIFY_AGENT_RUNTIME_BACKEND:-local}
      DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT: ${DIFY_AGENT_LOCAL_SANDBOX_ENDPOINT:-http://local_sandbox:5004}
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${SERVICE_PASSWORD_64_SHELLCTL}
      DIFY_AGENT_E2B_API_KEY: ${DIFY_AGENT_E2B_API_KEY:-}
      DIFY_AGENT_E2B_TEMPLATE: ${DIFY_AGENT_E2B_TEMPLATE:-difys-default-team/dify-agent-local-sandbox}
      DIFY_AGENT_SANDBOX_FILES_BASE_URL: ${DIFY_AGENT_SANDBOX_FILES_BASE_URL:-http://api:5001}
      DIFY_AGENT_STUB_API_BASE_URL: ${DIFY_AGENT_STUB_API_BASE_URL:-http://agent_backend:5050/agent-stub}
    depends_on:
      redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    networks:
      - default
      - agent_sandbox_network

  # ---------------------------------------------------------------------------
  # Local sandbox for agent shell workspaces. No route to `api`; its only
  # egress is agent_ssrf_proxy.
  # ---------------------------------------------------------------------------
  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.19.0
    restart: always
    command: ["shellctl", "serve", "--listen", "0.0.0.0:5004", "--require-auth-token"]
    environment:
      SHELLCTL_AUTH_TOKEN: ${SERVICE_PASSWORD_64_SHELLCTL}
      HTTP_PROXY: http://agent_ssrf_proxy:3128
      HTTPS_PROXY: http://agent_ssrf_proxy:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - dify_agent_local_sandbox_home:/home/dify
      - dify_agent_local_sandbox_workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent_sandbox_network
      - local_sandbox_proxy_network

  # ---------------------------------------------------------------------------
  # SSRF proxy for local_sandbox: allows the internet, agent_backend
  # /agent-stub/ and api /files/, and denies every other private address.
  # ---------------------------------------------------------------------------
  agent_ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    configs:
      - source: squid_agent_conf
        target: /etc/squid/squid.conf.template
      - source: squid_common_conf
        target: /etc/squid/dify_common.conf.template
      - source: ssrf_agent_entrypoint
        target: /docker-entrypoint-mount.sh
    entrypoint: ["sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"]
    environment:
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      SSRF_PROXY_ALLOW_PRIVATE_IPS: ${SSRF_PROXY_ALLOW_PRIVATE_IPS:-}
      SSRF_PROXY_ALLOW_PRIVATE_DOMAINS: ${SSRF_PROXY_ALLOW_PRIVATE_DOMAINS:-}
    networks:
      - default
      - local_sandbox_proxy_network

  # ---------------------------------------------------------------------------
  # nginx: single ingress. Coolify assigns a domain to it (SERVICE_FQDN_NGINX_80)
  # and routes its TLS-terminating proxy here on port 80.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:latest
    restart: always
    environment:
      - SERVICE_FQDN_NGINX_80
      - NGINX_SERVER_NAME=_
      - NGINX_HTTPS_ENABLED=false
      - NGINX_PORT=80
      - NGINX_SSL_PORT=443
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      - NGINX_KEEPALIVE_TIMEOUT=65
      - NGINX_PROXY_READ_TIMEOUT=3600s
      - NGINX_PROXY_SEND_TIMEOUT=3600s
      - NGINX_ENABLE_CERTBOT_CHALLENGE=false
      - NGINX_SOCKET_IO_UPSTREAM=api_websocket:5001
      - NGINX_SSL_CERT_FILENAME=dify.crt
      - NGINX_SSL_CERT_KEY_FILENAME=dify.key
      - NGINX_SSL_PROTOCOLS=TLSv1.2 TLSv1.3
      - CERTBOT_DOMAIN=
    # The entrypoint renders conf.d/default.conf from the template, which
    # replaces nginx's stock welcome config of the same name.
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf.template
      - source: nginx_proxy_conf
        target: /etc/nginx/proxy.conf.template
      - source: nginx_https_conf
        target: /etc/nginx/https.conf.template
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf.template
      - source: nginx_entrypoint
        target: /docker-entrypoint-mount.sh
    entrypoint: ["sh", "-c", "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh"]
    depends_on:
      - api
      - web
      - api_websocket
      - plugin_daemon
    expose:
      - "80"

  # ---------------------------------------------------------------------------
  # Weaviate vector store.
  # ---------------------------------------------------------------------------
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    restart: always
    volumes:
      - dify_weaviate_data:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: ${WEAVIATE_PERSISTENCE_DATA_PATH:-/var/lib/weaviate}
      QUERY_DEFAULTS_LIMIT: ${WEAVIATE_QUERY_DEFAULTS_LIMIT:-25}
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED:-false}
      DEFAULT_VECTORIZER_MODULE: ${WEAVIATE_DEFAULT_VECTORIZER_MODULE:-none}
      CLUSTER_HOSTNAME: ${WEAVIATE_CLUSTER_HOSTNAME:-node1}
      AUTHENTICATION_APIKEY_ENABLED: ${WEAVIATE_AUTHENTICATION_APIKEY_ENABLED:-true}
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${SERVICE_PASSWORD_WEAVIATE}
      AUTHENTICATION_APIKEY_USERS: ${WEAVIATE_AUTHENTICATION_APIKEY_USERS:-hello@dify.ai}
      AUTHORIZATION_ADMINLIST_ENABLED: ${WEAVIATE_AUTHORIZATION_ADMINLIST_ENABLED:-true}
      AUTHORIZATION_ADMINLIST_USERS: ${WEAVIATE_AUTHORIZATION_ADMINLIST_USERS:-hello@dify.ai}

networks:
  # Internal network: sandbox has no route to the internet except via ssrf_proxy.
  ssrf_proxy_network:
    driver: bridge
    internal: true
  # agent_backend <-> local_sandbox only.
  agent_sandbox_network:
    driver: bridge
    internal: true
  # local_sandbox <-> agent_ssrf_proxy only.
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
  default:
    driver: bridge

volumes:
  dify_app_storage:
  dify_db_data:
  dify_redis_data:
  dify_weaviate_data:
  dify_plugin_daemon:
  dify_sandbox_dependencies:
  dify_agent_local_sandbox_home:
  dify_agent_local_sandbox_workspace:

# BEGIN embedded configs (generated by scripts/embed-configs.py, do not edit)
configs:
  nginx_conf:  # nginx/nginx.conf.template
    content: |
      # Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.

      user  nginx;
      worker_processes  $${NGINX_WORKER_PROCESSES};

      error_log  /var/log/nginx/error.log notice;
      pid        /var/run/nginx.pid;


      events {
          worker_connections  1024;
      }


      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;

          # Keep Host and X-Forwarded-Port consistent so ProxyFix preserves the external port.
          map $$http_host $$dify_request_host {
              default $$http_host;
              ""      $$host;
          }

          map $$http_host $$dify_request_port {
              default "";
              ""      $$server_port;
              ~^(?:\[[^]]+\]|[^:]+):(?<dify_host_port>[0-9]+)$$ $$dify_host_port;
          }

          log_format  main  '$$remote_addr - $$remote_user [$$time_local] "$$request" '
                            '$$status $$body_bytes_sent "$$http_referer" '
                            '"$$http_user_agent" "$$http_x_forwarded_for"';

          access_log  /var/log/nginx/access.log  main;

          sendfile        on;
          #tcp_nopush     on;

          keepalive_timeout  $${NGINX_KEEPALIVE_TIMEOUT};

          #gzip  on;
          client_max_body_size $${NGINX_CLIENT_MAX_BODY_SIZE};

          include /etc/nginx/conf.d/*.conf;
      }
  nginx_proxy_conf:  # nginx/proxy.conf.template
    content: |
      # Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.

      proxy_set_header Host $$dify_request_host;
      # real_ip configuration must validate upstream proxies before replacing $$remote_addr.
      proxy_set_header X-Forwarded-For $$remote_addr;
      proxy_set_header X-Forwarded-Proto $$scheme;
      proxy_set_header X-Forwarded-Port $$dify_request_port;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout $${NGINX_PROXY_READ_TIMEOUT};
      proxy_send_timeout $${NGINX_PROXY_SEND_TIMEOUT};
  nginx_https_conf:  # nginx/https.conf.template
    content: |
      # Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.

      listen $${NGINX_SSL_PORT} ssl;
      ssl_certificate $${SSL_CERTIFICATE_PATH};
      ssl_certificate_key $${SSL_CERTIFICATE_KEY_PATH};
      ssl_protocols $${NGINX_SSL_PROTOCOLS};
      ssl_prefer_server_ciphers on;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;
  nginx_default_conf:  # nginx/conf.d/default.conf.template
    content: |
      # Please do not directly edit this file. Instead, modify the .env variables related to NGINX configuration.

      server {
          listen $${NGINX_PORT};
          server_name $${NGINX_SERVER_NAME};
          resolver 127.0.0.11 valid=30s ipv6=off;

          location /console/api {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /api {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /socket.io/ {
            set $$socket_io_upstream $${NGINX_SOCKET_IO_UPSTREAM};
            proxy_pass http://$$socket_io_upstream;
            include proxy.conf;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $$http_upgrade;
          }

          location /v1 {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /openapi {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /files {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /explore {
            set $$web_upstream web:3000;
            proxy_pass http://$$web_upstream;
            include proxy.conf;
          }

          location /e/ {
            set $$plugin_daemon_upstream plugin_daemon:5002;
            proxy_pass http://$$plugin_daemon_upstream;
            proxy_set_header Dify-Hook-Url $$scheme://$$host$$request_uri;
            include proxy.conf;
          }

          location / {
            set $$web_upstream web:3000;
            proxy_pass http://$$web_upstream;
            include proxy.conf;
          }

          location /mcp {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /triggers {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          location /callbacks/human-input/v2/im/ {
            set $$api_upstream api:5001;
            proxy_pass http://$$api_upstream;
            include proxy.conf;
          }

          # placeholder for acme challenge location
          $${ACME_CHALLENGE_LOCATION}

          # placeholder for https config defined in https.conf.template
          $${HTTPS_CONFIG}
      }
  nginx_entrypoint:  # nginx/docker-entrypoint.sh
    content: |
      #!/bin/bash

      HTTPS_CONFIG=''

      if [ "$${NGINX_HTTPS_ENABLED}" = "true" ]; then
          # Check if the certificate and key files for the specified domain exist
          if [ -n "$${CERTBOT_DOMAIN}" ] && \
             [ -f "/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_FILENAME}" ] && \
             [ -f "/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_KEY_FILENAME}" ]; then
              SSL_CERTIFICATE_PATH="/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_FILENAME}"
              SSL_CERTIFICATE_KEY_PATH="/etc/letsencrypt/live/$${CERTBOT_DOMAIN}/$${NGINX_SSL_CERT_KEY_FILENAME}"
          else
              SSL_CERTIFICATE_PATH="/etc/ssl/$${NGINX_SSL_CERT_FILENAME}"
              SSL_CERTIFICATE_KEY_PATH="/etc/ssl/$${NGINX_SSL_CERT_KEY_FILENAME}"
          fi
          export SSL_CERTIFICATE_PATH
          export SSL_CERTIFICATE_KEY_PATH

          # set the HTTPS_CONFIG environment variable to the content of the https.conf.template
          HTTPS_CONFIG=$$(envsubst < /etc/nginx/https.conf.template)
          export HTTPS_CONFIG
          # Substitute the HTTPS_CONFIG in the default.conf.template with content from https.conf.template
          envsubst '$${HTTPS_CONFIG}' < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf
      fi
      export HTTPS_CONFIG

      if [ "$${NGINX_ENABLE_CERTBOT_CHALLENGE}" = "true" ]; then
          ACME_CHALLENGE_LOCATION='location /.well-known/acme-challenge/ { root /var/www/html; }'
      else
          ACME_CHALLENGE_LOCATION=''
      fi
      export ACME_CHALLENGE_LOCATION

      env_vars=$$(printenv | cut -d= -f1 | sed 's/^/$$/g' | paste -sd, -)

      envsubst "$$env_vars" < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      envsubst "$$env_vars" < /etc/nginx/proxy.conf.template > /etc/nginx/proxy.conf

      envsubst "$$env_vars" < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf

      # Start Nginx using the default entrypoint
      exec nginx -g 'daemon off;'
  squid_conf:  # ssrf_proxy/squid.conf.template
    content: |
      include /etc/squid/dify_common.conf

      acl allowed_domains dstdomain .marketplace.dify.ai

      http_port $${HTTP_PORT}

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      http_access allow localhost manager
      http_access deny manager
      include /etc/squid/dify_sandbox_proxy.conf
      include /etc/squid/dify_allow_private.conf
      http_access deny to_private_networks
      http_access allow allowed_domains
      http_access allow client_localnet
      http_access allow localhost
      http_access deny all
  squid_common_conf:  # ssrf_proxy/squid-common.conf.template
    content: |
      # Shared Squid configuration used by both ssrf_proxy and agent_ssrf_proxy.

      ################################## ACL Definitions ################################
      acl client_localnet src 0.0.0.1-0.255.255.255	# RFC 1122 "this" network (LAN)
      acl client_localnet src 10.0.0.0/8		# RFC 1918 local private network (LAN)
      acl client_localnet src 100.64.0.0/10		# RFC 6598 shared address space (CGN)
      acl client_localnet src 169.254.0.0/16 	# RFC 3927 link-local (directly plugged) machines
      acl client_localnet src 172.16.0.0/12		# RFC 1918 local private network (LAN)
      acl client_localnet src 192.168.0.0/16		# RFC 1918 local private network (LAN)
      acl client_localnet src fc00::/7       	# RFC 4193 local private network range
      acl client_localnet src fe80::/10      	# RFC 4291 link-local (directly plugged) machines

      acl to_private_networks dst 0.0.0.0/8
      acl to_private_networks dst 10.0.0.0/8
      acl to_private_networks dst 100.64.0.0/10
      acl to_private_networks dst 127.0.0.0/8
      acl to_private_networks dst 169.254.0.0/16
      acl to_private_networks dst 172.16.0.0/12
      acl to_private_networks dst 192.168.0.0/16
      acl to_private_networks dst 224.0.0.0/4
      acl to_private_networks dst 240.0.0.0/4
      acl to_private_networks dst ::/128
      acl to_private_networks dst ::1/128
      acl to_private_networks dst ::ffff:0:0/96    # IPv4-mapped
      acl to_private_networks dst ::/96            # deprecated IPv4-compatible
      acl to_private_networks dst fc00::/7
      acl to_private_networks dst fe80::/10

      acl SSL_ports port 443
      acl Safe_ports port 80		# http
      acl Safe_ports port 21		# ftp
      acl Safe_ports port 443		# https
      acl Safe_ports port 70		# gopher
      acl Safe_ports port 210		# wais
      acl Safe_ports port 1025-65535	# unregistered ports
      acl Safe_ports port 280		# http-mgmt
      acl Safe_ports port 488		# gss-http
      acl Safe_ports port 591		# filemaker
      acl Safe_ports port 777		# multiling http
      acl CONNECT method CONNECT

      ################################## Common Parameters ################################

      tcp_outgoing_address 0.0.0.0

      ################################## Proxy Server ################################
      coredump_dir $${COREDUMP_DIR}
      refresh_pattern ^ftp:		1440	20%	10080
      refresh_pattern ^gopher:	1440	0%	1440
      refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
      refresh_pattern \/(Packages|Sources)(|\.bz2|\.gz|\.xz)$$ 0 0% 0 refresh-ims
      refresh_pattern \/Release(|\.gpg)$$ 0 0% 0 refresh-ims
      refresh_pattern \/InRelease$$ 0 0% 0 refresh-ims
      refresh_pattern \/(Translation-.*)(|\.bz2|\.gz|\.xz)$$ 0 0% 0 refresh-ims
      refresh_pattern .		0	20%	4320

      ################################## Request Buffer ################################
      client_request_buffer_max_size 100 MB

      ################################## Performance & Concurrency ###############################
      max_filedescriptors 65536
      connect_timeout 30 seconds
      request_timeout 2 minutes
      read_timeout 2 minutes
      client_lifetime 5 minutes
      shutdown_lifetime 30 seconds

      server_persistent_connections on
      client_persistent_connections on
      persistent_request_timeout 30 seconds
      pconn_timeout 1 minute

      client_db on
      server_idle_pconn_timeout 2 minutes
      client_idle_pconn_timeout 2 minutes

      quick_abort_min 16 KB
      quick_abort_max 16 MB
      quick_abort_pct 95

      memory_cache_mode disk
      cache_mem 256 MB
      maximum_object_size_in_memory 512 KB

      dns_timeout 30 seconds
      dns_retransmit_interval 5 seconds

      logformat dify_log %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
      access_log daemon:/var/log/squid/access.log dify_log
      logfile_rotate 10
  squid_agent_conf:  # ssrf_proxy/squid-agent.conf.template
    content: |
      # Dedicated Squid config for the dify-agent local_sandbox SSRF proxy.
      # All traffic on this proxy is restricted to:
      #   - agent_backend /agent-stub/* endpoints
      #   - Dify API /files/* endpoints (signed upload/download URLs)
      # External internet is allowed; all other private-network destinations are denied.

      include /etc/squid/dify_common.conf

      acl dst_agent_backend dstdomain agent_backend
      acl dst_dify_api dstdomain api
      acl path_files urlpath_regex -i ^/files/
      acl path_agent_stub urlpath_regex -i ^/agent-stub/

      http_port $${HTTP_PORT}

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports
      http_access allow dst_agent_backend path_agent_stub
      http_access allow dst_dify_api path_files
      include /etc/squid/dify_allow_private.conf
      http_access deny to_private_networks
      http_access allow all
  ssrf_entrypoint:  # ssrf_proxy/docker-entrypoint.sh
    content: |
      #!/bin/bash

      # Modified based on Squid OCI image entrypoint

      # This entrypoint aims to forward the squid logs to stdout to assist users of
      # common container related tooling (e.g., kubernetes, docker-compose, etc) to
      # access the service logs.

      # Moreover, it invokes the squid binary, leaving all the desired parameters to
      # be provided by the "command" passed to the spawned container. If no command
      # is provided by the user, the default behavior (as per the CMD statement in
      # the Dockerfile) will be to use Ubuntu's default configuration [1] and run
      # squid with the "-NYC" options to mimic the behavior of the Ubuntu provided
      # systemd unit.

      # [1] The default configuration is changed in the Dockerfile to allow local
      # network connections. See the Dockerfile for further information.

      echo "[ENTRYPOINT] re-create snakeoil self-signed certificate removed in the build process"
      if [ ! -f /etc/ssl/private/ssl-cert-snakeoil.key ]; then
          /usr/sbin/make-ssl-cert generate-default-snakeoil --force-overwrite > /dev/null 2>&1
      fi

      tail -F /var/log/squid/access.log 2>/dev/null &
      tail -F /var/log/squid/error.log 2>/dev/null &
      tail -F /var/log/squid/store.log 2>/dev/null &
      tail -F /var/log/squid/cache.log 2>/dev/null &

      ALLOW_PRIVATE_CONF=/etc/squid/dify_allow_private.conf
      SANDBOX_PROXY_CONF=/etc/squid/dify_sandbox_proxy.conf

      write_optional_private_allowlist() {
          local env_name="$$1"
          local acl_name="$$2"
          local acl_type="$$3"
          local raw_values="$${!env_name:-}"

          raw_values="$${raw_values//,/ }"

          if [ -z "$${raw_values//[[:space:]]/}" ]; then
              return
          fi

          printf 'acl %s %s' "$$acl_name" "$$acl_type" >> "$$ALLOW_PRIVATE_CONF"
          for value in $$raw_values; do
              printf ' %s' "$$value" >> "$$ALLOW_PRIVATE_CONF"
          done
          printf '\nhttp_access allow client_localnet %s\n' "$$acl_name" >> "$$ALLOW_PRIVATE_CONF"
      }

      {
          echo "# Generated by docker-entrypoint.sh."
          echo "# Allows selected private targets before the default private-network deny rule."
      } > "$$ALLOW_PRIVATE_CONF"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_IPS" "dify_allowed_private_networks" "dst"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_DOMAINS" "dify_allowed_private_domains" "dstdomain"

      {
          echo "# Generated by docker-entrypoint.sh."
          echo "# Enables the middleware-only sandbox host bridge when configured."
      } > "$$SANDBOX_PROXY_CONF"

      if [ -n "$${SSRF_SANDBOX_PROXY_PORT:-}" ]; then
          sandbox_proxy_host="$${SSRF_SANDBOX_PROXY_HOST:-sandbox}"
          sandbox_proxy_target_port="$${SANDBOX_PORT:-8194}"

          {
              printf 'http_port %s accel vhost\n' "$$SSRF_SANDBOX_PROXY_PORT"
              printf 'cache_peer %s parent %s 0 no-query originserver name=dify_sandbox\n' \
                  "$$sandbox_proxy_host" \
                  "$$sandbox_proxy_target_port"
              printf 'acl dify_sandbox_proxy_port localport %s\n' "$$SSRF_SANDBOX_PROXY_PORT"
              printf 'http_access allow dify_sandbox_proxy_port\n'
          } >> "$$SANDBOX_PROXY_CONF"
      fi

      # Replace environment variables in a template file.
      expand_env() {
          awk '{
              while(match($$0, /\$${[A-Za-z_][A-Za-z_0-9]*}/)) {
                  var = substr($$0, RSTART+2, RLENGTH-3)
                  val = ENVIRON[var]
                  $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
              }
              print
          }' "$$1"
      }

      # Replace environment variables in the templates and output to squid.conf
      echo "[ENTRYPOINT] replacing environment variables in the templates"
      expand_env /etc/squid/squid.conf.template > /etc/squid/squid.conf
      expand_env /etc/squid/dify_common.conf.template > /etc/squid/dify_common.conf

      /usr/sbin/squid -Nz
      echo "[ENTRYPOINT] starting squid"
      /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
  ssrf_agent_entrypoint:  # ssrf_proxy/docker-agent-entrypoint.sh
    content: |
      #!/bin/bash

      tail -F /var/log/squid/access.log 2>/dev/null &
      tail -F /var/log/squid/error.log 2>/dev/null &
      tail -F /var/log/squid/store.log 2>/dev/null &
      tail -F /var/log/squid/cache.log 2>/dev/null &

      ALLOW_PRIVATE_CONF=/etc/squid/dify_allow_private.conf

      write_optional_private_allowlist() {
          local env_name="$$1"
          local acl_name="$$2"
          local acl_type="$$3"
          local raw_values="$${!env_name:-}"
          local -a tokens=()

          raw_values="$${raw_values//,/ }"
          raw_values="$${raw_values//$$'\n'/ }"
          raw_values="$${raw_values//$$'\r'/ }"

          if [ -z "$${raw_values//[[:space:]]/}" ]; then
              return
          fi

          read -r -a tokens <<< "$$raw_values"

          printf 'acl %s %s' "$$acl_name" "$$acl_type" >> "$$ALLOW_PRIVATE_CONF"
          for value in "$${tokens[@]}"; do
              [ -z "$${value//[[:space:]]/}" ] && continue
              printf ' %s' "$$value" >> "$$ALLOW_PRIVATE_CONF"
          done
          printf '\nhttp_access allow client_localnet %s\n' "$$acl_name" >> "$$ALLOW_PRIVATE_CONF"
      }

      {
          echo "# Generated by docker-agent-entrypoint.sh."
          echo "# Allows selected private targets before the default private-network deny rule."
      } > "$$ALLOW_PRIVATE_CONF"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_IPS" "dify_allowed_private_networks" "dst"
      write_optional_private_allowlist "SSRF_PROXY_ALLOW_PRIVATE_DOMAINS" "dify_allowed_private_domains" "dstdomain"

      expand_env() {
          awk '{
              while(match($$0, /\$${[A-Za-z_][A-Za-z_0-9]*}/)) {
                  var = substr($$0, RSTART+2, RLENGTH-3)
                  val = ENVIRON[var]
                  $$0 = substr($$0, 1, RSTART-1) val substr($$0, RSTART+RLENGTH)
              }
              print
          }' "$$1"
      }

      echo "[ENTRYPOINT] replacing environment variables in the templates"
      expand_env /etc/squid/squid.conf.template > /etc/squid/squid.conf
      expand_env /etc/squid/dify_common.conf.template > /etc/squid/dify_common.conf

      /usr/sbin/squid -Nz
      echo "[ENTRYPOINT] starting squid"
      /usr/sbin/squid -f /etc/squid/squid.conf -NYC 1
  sandbox_config:  # volumes/sandbox/conf/config.yaml
    content: |
      app:
        port: 8194
        debug: True
        key: dify-sandbox
      max_workers: 4
      max_requests: 50
      worker_timeout: 5
      enable_network: True # please make sure there is no network risk in your environment
      allowed_syscalls: # please leave it empty if you have no idea how seccomp works
      proxy:
        socks5: ''
        http: ''
        https: ''
  postgres_initdb_plugin:  # postgres/initdb/01-create-plugin-db.sh
    content: |
      #!/bin/bash
      # Create the plugin daemon's database (`dify_plugin`) if it does not exist.
      #
      # The Dify plugin daemon normally creates this database itself, but doing it
      # here removes any dependency on that behavior / on CREATEDB timing. This script
      # is run by the postgres image only on first initialization of an empty data
      # directory, so it is a no-op on subsequent restarts.
      set -e

      PLUGIN_DB="$${DB_PLUGIN_DATABASE:-dify_plugin}"

      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
      	SELECT 'CREATE DATABASE "$${PLUGIN_DB}"'
      	WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$${PLUGIN_DB}')\gexec
      EOSQL

      echo "[initdb] ensured database '$${PLUGIN_DB}' exists"
# END embedded configs
